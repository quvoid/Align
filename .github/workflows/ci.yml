name: Align CI / Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check
        run: pnpm --filter @branddeals/web type-check

      - name: Run Vitest Unit Tests
        run: pnpm --filter @branddeals/web test

      - name: Build Web App
        run: pnpm --filter @branddeals/web build
        env:
          # Build-time placeholder only. CI compiles the app; it never serves a
          # session, so this value is deliberately not the production secret.
          # The real AUTH_SECRET lives in the Vercel environment.
          AUTH_SECRET: "ci-build-only-placeholder-not-a-real-secret-000"
          NEXTAUTH_URL: "https://align-web-five.vercel.app"
